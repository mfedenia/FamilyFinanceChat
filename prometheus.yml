global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "openwebui-exporter"
    static_configs:
      - targets: ["metrics-exporter:8000"]
    metrics_path: /metrics

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "openwebui"
    static_configs:
      - targets: ["open-webui:8080"]
    metrics_path: /metrics

  - job_name: "openwebui-exporter-staging"
    static_configs:
      - targets: ["metrics-exporter-staging:8000"]
    metrics_path: /metrics

  - job_name: "openwebui-staging"
    static_configs:
      - targets: ["open-webui-staging:8080"]
    metrics_path: /metrics

  # Filter Functions push metrics here; honor_labels keeps pushed job/instance labels.
  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: "pushgateway-staging"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway-staging:9091"]