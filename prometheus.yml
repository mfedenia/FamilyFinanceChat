
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "openwebui-exporter"
    static_configs:
      - targets: ["metrics-exporter:8000"]

  - job_name: "openwebui-otel"
    static_configs:
      - targets: ["otel-collector:8889"]

  # Filter Functions push chat metrics here; honor_labels keeps the pushed job/instance labels.
  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
