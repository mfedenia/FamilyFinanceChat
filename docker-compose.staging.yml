services:
  qdrant-staging:
    image: qdrant/qdrant:latest
    container_name: qdrant-staging
    restart: unless-stopped
    networks: [ai-net-staging]
    volumes:
      - ${STAGING_QDRANT_STORAGE_DIR}:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      start_period: 10s
      interval: 15s
      timeout: 5s
      retries: 3

  redis-staging:
    image: valkey/valkey:8.0.1-alpine
    container_name: redis-staging
    restart: unless-stopped
    networks: [ai-net-staging]
    volumes:
      - ${STAGING_REDIS_DATA_DIR}:/data
    command: >-
      valkey-server
      --save 30 1
      --maxclients 10000
      --timeout 1800
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 5

  open-webui-staging:
    build: .
    container_name: open-webui-staging
    depends_on: [qdrant-staging, redis-staging]
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant-staging:6333
      - WEBSOCKET_MANAGER=redis
      - WEBSOCKET_REDIS_URL=redis://redis-staging:6379/1
    networks: [ai-net-staging, ai-net]
    ports:
      - "0.0.0.0:${STAGING_WEBUI_PORT}:8080"
    volumes:
      - ${STAGING_UPLOADS_DIR}:/app/backend/data/uploads
      - ${STAGING_OPENWEBUI_DATA_DIR}:/app/backend/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 3

  metrics-exporter-staging:
    build: ./monitoring/exporter
    container_name: metrics-exporter-staging
    restart: unless-stopped
    networks: [ai-net-staging, ai-net]
    depends_on: [open-webui-staging]
    environment:
      - OPENWEBUI_BASE=http://open-webui-staging:8080
    ports:
      - "8002:8000"

  # Staging-only push path; join external ai-net so host Prometheus can scrape pushgateway-staging:9091.
  pushgateway-staging:
    image: prom/pushgateway:v1.8.0
    container_name: pushgateway-staging
    restart: unless-stopped
    networks: [ai-net-staging, ai-net]
    ports:
      - "${STAGING_PUSHGATEWAY_PORT:-9092}:9091"
    command:
      - "--web.enable-lifecycle"

networks:
  ai-net-staging:
    driver: bridge
  ai-net:
    external: true
