networks:
  ai-net:
    driver: bridge

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: qdrant
    restart: unless-stopped
    networks: [ai-net]
    volumes:
      - /opt/qdrant/storage:/qdrant/storage

  redis:
    image: valkey/valkey:8.0.1-alpine
    container_name: redis
    restart: unless-stopped
    networks: [ai-net]
    volumes:
      - redis-data:/data
    command: >-
      valkey-server
      --save 30 1
      --maxclients 10000
      --timeout 1800
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
        
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    container_name: otel-collector
    restart: unless-stopped
    networks: [ai-net]
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    volumes:
      - ./monitoring/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:8889:8889"

  # ollama:

  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   restart: unless-stopped
  #   networks: [ai-net]
  #   volumes:
  #     - ollama:/root/.ollama
  #   ports:
  #     - "11435:11434"

  
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4
    container_name: open-webui
    depends_on:
      - qdrant
      - redis
      - otel-collector
    restart: unless-stopped
    environment:
      - PYTHONDONTWRITEBYTECODE=1

      # Database connections
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
      - WEBSOCKET_MANAGER=redis
      - REDIS_URL=redis://redis:6379/0
      - WEBSOCKET_REDIS_URL=redis://redis:6379/1

      # OpenTelemetry
      - ENABLE_OTEL=true
      - ENABLE_OTEL_METRICS=true
      - ENABLE_OTEL_TRACES=false
      - ENABLE_OTEL_LOGS=false
      - OTEL_SERVICE_NAME=open-webui
      - OTEL_METRICS_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_METRICS_EXPORTER_OTLP_INSECURE=true
      - OTEL_METRICS_EXPORT_INTERVAL_MILLIS=10000

      # Served through the reverse proxy (A16). WEBUI_URL is stored in the database after the
      # first start; on an existing install also set Admin Panel > Settings > General > WebUI URL.
      # The localhost origins keep the SSH-tunnel route below working (socket.io checks Origin).
      - WEBUI_URL=https://${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME in .env (SETUP.md section 9)}
      - CORS_ALLOW_ORIGIN=https://${PUBLIC_HOSTNAME};http://localhost:3000;http://127.0.0.1:3000

    env_file: .env
    networks: [ai-net]
    ports:
      # Localhost only: the public route is the proxy. Operators and the smoke checks use this.
      - "127.0.0.1:3000:8080"
    volumes:
      - /mnt/gcs/fin602:/app/backend/data/uploads
      - /opt/openwebui/data:/app/backend/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 10g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    container_name: cadvisor
    restart: unless-stopped
    command:
     - --housekeeping_interval=30s
     - --docker_only=true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    networks: [ai-net]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "127.0.0.1:8080:8080"

  
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    restart: unless-stopped
    networks: [ai-net]
    depends_on:
      - otel-collector
    user: "65534:65534"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      # No authentication of its own: localhost only (SSH tunnel), never through the proxy.
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"

  # # Receives metrics from Open WebUI Filter Functions (HTTP push); Prometheus scrapes this target.
  # pushgateway:
  #   image: prom/pushgateway:v1.8.0
  #   container_name: pushgateway
  #   restart: unless-stopped
  #   networks: [ai-net]
  #   ports:
  #     - "9091:9091"
  #   command:
  #     - "--web.enable-lifecycle"

  metrics-exporter:
    build: ./monitoring/exporter
    container_name: metrics-exporter
    restart: unless-stopped
    networks: [ai-net]
    depends_on: [open-webui]
    ports:
      - "127.0.0.1:8001:8000"

  
  grafana:
    image: grafana/grafana:9.0.0
    container_name: grafana
    restart: unless-stopped
    networks: [ai-net]
    user: "472:0"
    environment:
      # Applies only when Grafana's database is first created. To change an existing admin
      # password (production still had admin/admin), see SETUP.md section 9.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      # Served by the reverse proxy at https://$PUBLIC_HOSTNAME/grafana/ (A16).
      - GF_SERVER_ROOT_URL=https://${PUBLIC_HOSTNAME}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    ports:
      # Localhost only; through a tunnel it is at http://localhost:3001/grafana/.
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro


  # Grading dashboard: frontend + API in one container (grading_feature/Dockerfile).
  # Not published on the host: it is reached only through the proxy at /grading/, which adds
  # authentication (A16). The frontend is built for that path.
  grading:
    build:
      context: ./grading_feature
      args:
        VITE_BASE: /grading/
    container_name: grading
    restart: unless-stopped
    networks: [ai-net]
    depends_on: [open-webui]
    env_file:
      - path: ./grading_feature/.env
        required: false
    environment:
      # Override the host-oriented values a local grading_feature/.env may carry.
      - OPENWEBUI_BASE_URL=http://open-webui:8080
      - DATA_PATH=/data/extracted_chats.json
      - OUTPUT_PATH=/data/extracted_chats.json
    volumes:
      # Not "grading-data": A14's grading-api left a root-owned volume by that name, and this
      # image runs as uid 10001, so reusing it would make /data unwritable and break refresh.
      - grading-dashboard-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9500/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Reverse proxy (A16): the only service published beyond localhost. TLS, path routing, and
  # the grading dashboard's login. Configuration: proxy/Caddyfile; setup: SETUP.md section 9.
  proxy:
    image: caddy:2.10.2-alpine
    container_name: proxy
    restart: unless-stopped
    networks: [ai-net]
    environment:
      - PUBLIC_HOSTNAME=${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME in .env (SETUP.md section 9)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./proxy:/etc/caddy:ro
      # Certificates and ACME account. Keep it: re-issuing on every recreate hits rate limits.
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
  grading-dashboard-data:
  prometheus-data:
  grafana-data:
  caddy-data:
  caddy-config:
