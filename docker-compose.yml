networks:
  ai-net:
    driver: bridge

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: qdrant
    restart: unless-stopped
    networks: [ai-net]
    volumes:
      - /opt/qdrant/storage:/qdrant/storage

  redis:
    image: valkey/valkey:8.0.1-alpine
    container_name: redis
    restart: unless-stopped
    networks: [ai-net]
    volumes:
      - redis-data:/data
    command: >-
      valkey-server
      --save 30 1
      --maxclients 10000
      --timeout 1800
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
    
  grading-api:
    build:
      context: ./grading_feature/backend
      dockerfile: Dockerfile
    container_name: grading-api
    restart: unless-stopped
    depends_on:
      - open-webui
    networks:
      - ai-net
    env_file:
      - ./grading_feature/backend/grading.env
    environment:
      OPENWEBUI_BASE_URL: http://open-webui:8080
      DATA_PATH: /app/data/chats.json
      OUTPUT_PATH: /app/data/chats.json
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - grading-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    container_name: otel-collector
    restart: unless-stopped
    networks: [ai-net]
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    volumes:
      - ./monitoring/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:8889:8889"



  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   restart: unless-stopped
  #   networks: [ai-net]
  #   volumes:
  #     - ollama:/root/.ollama
  #   ports:
  #     - "11435:11434"

  
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4
    container_name: open-webui
    depends_on:
      - qdrant
      - redis
      - otel-collector
    restart: unless-stopped
    environment:
      - PYTHONDONTWRITEBYTECODE=1

      # Database connections
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
      - WEBSOCKET_MANAGER=redis
      - REDIS_URL=redis://redis:6379/0
      - WEBSOCKET_REDIS_URL=redis://redis:6379/1

      # OpenTelemetry
      - ENABLE_OTEL=true
      - ENABLE_OTEL_METRICS=true
      - ENABLE_OTEL_TRACES=false
      - ENABLE_OTEL_LOGS=false
      - OTEL_SERVICE_NAME=open-webui
      - OTEL_METRICS_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_METRICS_EXPORTER_OTLP_INSECURE=true
      - OTEL_METRICS_EXPORT_INTERVAL_MILLIS=10000

    env_file: .env
    networks: [ai-net]
    ports:
      - "0.0.0.0:3000:8080"
    volumes:
      - /mnt/gcs/fin602:/app/backend/data/uploads
      - /opt/openwebui/data:/app/backend/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 10g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    container_name: cadvisor
    restart: unless-stopped
    command:
     - --housekeeping_interval=30s
     - --docker_only=true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    networks: [ai-net]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"

  
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    restart: unless-stopped
    networks: [ai-net]
    depends_on:
      - otel-collector
    user: "65534:65534"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"

  # # Receives metrics from Open WebUI Filter Functions (HTTP push); Prometheus scrapes this target.
  # pushgateway:
  #   image: prom/pushgateway:v1.8.0
  #   container_name: pushgateway
  #   restart: unless-stopped
  #   networks: [ai-net]
  #   ports:
  #     - "9091:9091"
  #   command:
  #     - "--web.enable-lifecycle"

  metrics-exporter:
    build: ./monitoring/exporter
    container_name: metrics-exporter
    restart: unless-stopped
    networks: [ai-net]
    depends_on: [open-webui]
    ports:
      - "8001:8000"

  
  grafana:
    image: grafana/grafana:9.0.0
    container_name: grafana
    restart: unless-stopped
    networks: [ai-net]
    user: "472:0"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro


volumes:
  redis-data:
  grading-data:
  prometheus-data:
  grafana-data:
